[package]
name = "agent-link-supervisor"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Durable operation and ownership coordination for application-hosted agent workers."
license = "MIT"
publish = false
readme = "README.md"

[dependencies]
agent-link = { path = "..", default-features = false, features = ["codex"], optional = true }
serde_json = { version = "1", optional = true }
fs2 = "0.4.3"
getrandom = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[features]
codex = ["dep:agent-link", "dep:serde_json"]
# Offline subprocess fixture only; applications should leave disabled.
test-support = []

[[bin]]
name = "supervisor-fixture"
path = "tests/support/worker.rs"
required-features = ["test-support"]
test = false
doc = false

[[test]]
name = "processes"
required-features = ["test-support"]

[[test]]
name = "codex_runtime"
required-features = ["test-support", "codex"]
