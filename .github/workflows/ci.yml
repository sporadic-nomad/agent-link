name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Stable / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/check.py
      - run: cargo package --locked

  msrv:
    name: Rust 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.85.0'
      - run: cargo check --locked --workspace --lib --no-default-features
      - run: cargo check --locked --lib --no-default-features --features tools
      - run: cargo check --locked --all-targets --no-default-features --features turns
      - run: cargo check --locked --all-targets --no-default-features --features questions
      - run: cargo check --locked --workspace --lib --all-features
      - run: cargo check --locked -p agent-link-daemon --all-targets --all-features
